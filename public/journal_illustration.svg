<svg viewBox="270 230 780 610" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ============ BOOK COVER (back layers) ============ -->
  <!-- left cover tab -->
  <path d="M300 330 L360 300 L360 470 L300 500 Z" fill="#3d4266" stroke="#22243b" stroke-width="4" stroke-linejoin="round"/>
  <!-- main navy cover shape -->
  <path d="M330 300
           L640 250
           L960 340
           L940 620
           L620 700
           L300 640
           Z"
        fill="#4a4f77" stroke="#22243b" stroke-width="5" stroke-linejoin="round"/>

  <!-- ribbon bookmark hanging down -->
  <path d="M640 260 C 645 400, 630 550, 640 680 L 655 800 L 615 720 L 600 780 L 615 650 C 610 500, 625 380, 660 260 Z"
        fill="#f2f1ec" stroke="#22243b" stroke-width="3" stroke-linejoin="round"/>

  <!-- ============ LEFT PAGE ============ -->
  <path d="M360 290
           L640 260
           L620 690
           L330 630
           Z"
        fill="#f7f6f0" stroke="#22243b" stroke-width="5" stroke-linejoin="round"/>

  <!-- photo/frame with scribble on left page -->
  <rect x="395" y="300" width="140" height="110" rx="4" fill="#f7f6f0" stroke="#22243b" stroke-width="3.5"/>
  <path d="M410 375 c10 15 25 15 35 0 c8 -12 20 -12 28 3 c6 10 18 10 25 -2"
        fill="none" stroke="#22243b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="425" cy="360" r="3" fill="#22243b"/>
  <circle cx="465" cy="368" r="3" fill="#22243b"/>
  <!-- black tab/flag sticking out of photo -->
  <rect x="470" y="270" width="16" height="45" fill="#1c1c1c"/>

  <!-- horizontal text lines, left page top -->
  <g stroke="#3a3a3a" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M400 340 q60 -3 130 0"/>
    <path d="M400 365 q70 -3 140 0"/>
    <path d="M395 430 q90 -4 180 2"/>
    <path d="M392 462 q95 -4 190 2"/>
    <path d="M388 494 q100 -4 200 2"/>
    <path d="M385 526 q105 -4 205 3"/>
  </g>

  <!-- small squiggle + arrow to a box, left page bottom -->
  <path d="M368 555 q8 -10 16 0 t16 0 t16 0" fill="none" stroke="#22243b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M400 565 q45 25 85 40" fill="none" stroke="#22243b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <rect x="478" y="565" width="70" height="65" fill="none" stroke="#22243b" stroke-width="3"/>

  <!-- flowers, left page bottom -->
  <g>
    <g transform="translate(378,600)">
      <circle cx="0" cy="-14" r="9" fill="#7d8a3f"/>
      <circle cx="13" cy="-6" r="9" fill="#7d8a3f"/>
      <circle cx="13" cy="9" r="9" fill="#7d8a3f"/>
      <circle cx="-13" cy="9" r="9" fill="#7d8a3f"/>
      <circle cx="-13" cy="-6" r="9" fill="#7d8a3f"/>
      <circle cx="0" cy="0" r="7" fill="#f4e2b8"/>
    </g>
    <g transform="translate(425,635) scale(0.75)">
      <circle cx="0" cy="-14" r="9" fill="#8a9650"/>
      <circle cx="13" cy="-6" r="9" fill="#8a9650"/>
      <circle cx="13" cy="9" r="9" fill="#8a9650"/>
      <circle cx="-13" cy="9" r="9" fill="#8a9650"/>
      <circle cx="-13" cy="-6" r="9" fill="#8a9650"/>
      <circle cx="0" cy="0" r="7" fill="#f4e2b8"/>
    </g>
  </g>

  <!-- little cursive "eee" marks, left page -->
  <path d="M500 618 q10 -14 16 0 q4 10 -6 10 q-10 0 -6 -10 M525 618 q10 -14 16 0 q4 10 -6 10 q-10 0 -6 -10 M550 618 q10 -14 16 0 q4 10 -6 10 q-10 0 -6 -10"
        fill="none" stroke="#22243b" stroke-width="2.3"/>

  <!-- ============ RIGHT PAGE ============ -->
  <path d="M660 260
           L935 330
           L915 610
           L640 690
           Z"
        fill="#f7f6f0" stroke="#22243b" stroke-width="5" stroke-linejoin="round"/>

  <!-- star doodle, right page -->
  <path d="M840 300
           l10 22 l24 3 l-18 16 l5 24 l-21 -13 l-21 13 l5 -24 l-18 -16 l24 -3 z"
        fill="#e0a94f" stroke="#22243b" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- text lines, right page -->
  <g stroke="#3a3a3a" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M690 350 q80 -4 170 3"/>
    <path d="M690 400 q90 -4 190 3"/>
    <path d="M685 460 q95 -4 195 3"/>
  </g>

  <!-- cursive "eee" marks right page -->
  <path d="M680 555 q10 -14 16 0 q4 10 -6 10 q-10 0 -6 -10 M705 555 q10 -14 16 0 q4 10 -6 10 q-10 0 -6 -10 M730 555 q10 -14 16 0 q4 10 -6 10 q-10 0 -6 -10"
        fill="none" stroke="#22243b" stroke-width="2.3"/>

  <!-- small sprig of leaves -->
  <g stroke="#22243b" stroke-width="2.3" fill="none" stroke-linecap="round">
    <path d="M690 580 q-5 40 -15 70"/>
    <path d="M685 600 q-15 -6 -22 -2"/>
    <path d="M683 615 q15 -8 24 -6"/>
    <path d="M679 630 q-15 -4 -22 2"/>
    <path d="M676 645 q14 -6 22 -2"/>
  </g>

  <!-- box with dark scribble corner, right page bottom -->
  <rect x="735" y="590" width="95" height="80" fill="none" stroke="#22243b" stroke-width="3"/>
  <path d="M745 655 q10 5 20 -3 t18 2" stroke="#1c1c1c" stroke-width="9" fill="none" stroke-linecap="round"/>
  <rect x="832" y="595" width="14" height="45" fill="none" stroke="#22243b" stroke-width="2.5"/>

  <!-- ============ PEN ============ -->
  <g>
    <!-- pen body -->
    <path d="M990 400 L845 610 L865 630 L1010 420 Z" fill="#f7f6f0" stroke="#22243b" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- pen clip line -->
    <path d="M960 440 L825 640" stroke="#22243b" stroke-width="1.8"/>
    <!-- pen tip -->
    <path d="M845 610 L800 645 L825 625 Z" fill="#1c1c1c" stroke="#22243b" stroke-width="2" stroke-linejoin="round"/>
    <path d="M800 645 l10 -14" stroke="#22243b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- pen cap top -->
    <rect x="985" y="380" width="30" height="45" rx="4" transform="rotate(35 1000 400)" fill="#f7f6f0" stroke="#22243b" stroke-width="3"/>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22243b"/>
    </marker>
  </defs>
</svg>